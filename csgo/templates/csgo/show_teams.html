{% extends 'base.html' %}
{% block title %}Teams - CS - Foth.dev{% endblock %}
{% block content %}
<article>
  <h2>--- Teams ---</h2>
</article>
<div class="teams">
  <div class="board">
    <div class="board-row board-head">Team A</div>
    {% for player in team_a %}<div class="board-row board-win">  {{ player }}</div>
    {% endfor %}
  </div>
  <div class="board">
    <div class="board-row board-head">Team B</div>
    {% for player in team_b %}<div class="board-row silver">  {{ player }}</div>
    {% endfor %}
  </div>
</div>
<p><a href="{% url 'cs:select_players' %}">[Shuffle again]</a> <a href="{% url 'cs:index' %}">[Rankings]</a></p>
{% endblock content %}
