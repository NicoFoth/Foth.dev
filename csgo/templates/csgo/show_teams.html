{% extends 'base.html' %}
{% block title %}Teams - CS - Foth.dev{% endblock %}
{% block content %}
<h1>Teams</h1>
<div class="teams">
  <div class="table-wrap">
  <table>
    <caption>Team A</caption>
    <tbody>
    {% for player in team_a %}<tr><td>{{ player }}</td></tr>
    {% endfor %}
    </tbody>
  </table>
  </div>
  <div class="table-wrap">
  <table>
    <caption>Team B</caption>
    <tbody>
    {% for player in team_b %}<tr><td>{{ player }}</td></tr>
    {% endfor %}
    </tbody>
  </table>
  </div>
</div>
<div class="actions"><a class="button" href="{% url 'cs:select_players' %}">Shuffle again</a> <a href="{% url 'cs:index' %}">Rankings</a></div>
{% endblock content %}
