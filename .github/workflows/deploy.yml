name: Deploy

on:
  push:
    branches: [main]

concurrency: deploy

jobs:
  test:
    uses: ./.github/workflows/django.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      # The deploy key is restricted on the server to a forced command
      # (/usr/local/sbin/deploy-foth-dev): git pull, rebuild the `website` compose
      # service, migrate, reload nginx. The script sent here is ignored.
      - uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: deploy

      # From the runner, so it goes through DNS, TLS and nginx like a visitor would.
      # Retries cover the few seconds gunicorn needs to come up after the rebuild. The
      # User-Agent must not start with curl/, or / answers with the plain-text page.
      - name: Smoke test
        run: |
          set -euo pipefail
          curl_() { curl -sS -A 'foth.dev deploy smoke test' --retry 10 --retry-delay 3 --retry-all-errors "$@"; }

          code=$(curl_ -o page.html -w '%{http_code}' https://foth.dev/)
          echo "/ -> $code"
          [ "$code" = 200 ]

          [[ $(<page.html) =~ href=\"(/static/[^\"]+\.css)\" ]] || { echo "no stylesheet link on /"; exit 1; }
          css=${BASH_REMATCH[1]}

          out=$(curl_ -o /dev/null -w '%{http_code} %{content_type}' "https://foth.dev$css")
          echo "$css -> $out"
          read -r code type <<<"$out"
          [ "$code" = 200 ] && [[ $type == text/css* ]]
